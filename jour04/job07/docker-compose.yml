services:
  php:
    image: php:8.2-apache
    ports:
      - "8080:80"
    build: ./src
    environment:
      PMA_HOST: db
      PMA_USER: dev
      PMA_PASSWORD: pass
    depends_on: [db]

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: lamp_demo
      MYSQL_USER: dev
      MYSQL_PASSWORD: pass
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8081:80"
    depends_on: [db]

volumes:
  db_data:
