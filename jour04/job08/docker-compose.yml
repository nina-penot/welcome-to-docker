services:
  frontend:
    image: node:20-alpine
    command: sh -c "npm install && npm run dev"
    environment:
      CHOKIDAR_USEPOLLING: true
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    image: node:20-alpine
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: dbtest
      MYSQL_USER: dev
      MYSQL_PASSWORD: pass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 20s
      timeout: 10s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
