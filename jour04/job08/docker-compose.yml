services:
  frontend:
    image: node:18-alpine
    ports:
      - "5173:80"

  backend:
    image: node:20-alpine
    depends_on: [db]
    working_dir: /src
    volumes:
      - ./backend:/src
      - /src/node_modules
    ports:
      - "3000:80"

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: lamp_demo
      MYSQL_USER: dev
      MYSQL_PASSWORD: pass
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
